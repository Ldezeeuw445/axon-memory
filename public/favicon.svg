<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- AXON — simplified wireframe summit. The full logo art is far too fine
       to read at 16px, so this keeps what survives at that size: the
       silhouette, the triangulation and the lit apex. -->
  <defs>
    <linearGradient id="axonGold" x1="32" y1="10" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd98a"/>
      <stop offset="45%" stop-color="#ffb733"/>
      <stop offset="100%" stop-color="#b9741a"/>
    </linearGradient>
    <linearGradient id="axonTile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1b1d"/>
      <stop offset="60%" stop-color="#0c0d0e"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="axonApex" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5dc" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffb733" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb733" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#axonTile)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <g stroke="url(#axonGold)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M6 51 L18 29 L25 39 L32 14 L40 34 L46 30 L58 51"/>
    <path d="M32 14 L21 51 M32 14 L32 51 M32 14 L43 51"/>
    <path d="M18 29 L12 51 M18 29 L25 51"/>
    <path d="M46 30 L40 51 M46 30 L53 51"/>
    <path d="M24 33 L32 30 L40 34" opacity="0.9"/>
    <path d="M14 42 L23 39 L32 41 L41 39 L50 42" opacity="0.8"/>
  </g>

  <circle cx="32" cy="14" r="7" fill="url(#axonApex)"/>
  <circle cx="32" cy="14" r="1.7" fill="#fff6e0"/>
</svg>
