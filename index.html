<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the cinematic canvas paint behind the status
         bar and the gesture pill. UI chrome (tab bar, drawers) then respects
         env(safe-area-inset-*) so content is not trapped under the clock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Favicon. The 1024px logo was being served as the tab icon, so every
         visit pulled ~1.2 MB to draw 16 pixels; these are the real sizes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/ios/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AXON" />
    <meta name="description" content="AXON — The universal AI memory layer. Connect your AI tools and data sources once, benefit everywhere." />
    <title>AXON — Universal AI Memory</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AXON — Universal AI Memory" />

    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:url" content="https://www.axon-memory.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AXON — Universal AI Memory" />
    <meta name="twitter:description" content="AXON — The universal AI memory layer. Connect your AI tools and data sources once, benefit everywhere." />
    <meta name="twitter:image" content="/icon-512.png" />
